services:
  - type: web
    name: sophia
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sophia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_CODE
        sync: false

databases:
  - name: sophia-db
    plan: free
